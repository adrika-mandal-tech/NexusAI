[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nexusai-backend"
version = "0.1.0"
description = "NexusAI — Enterprise Agentic Knowledge Platform (Backend)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
    "passlib[bcrypt]>=1.7",
    "python-jose[cryptography]>=3.3",
    "email-validator>=2.1",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "qdrant-client>=1.9",
    "neo4j>=6.2.0,<7.0.0",
    "neo4j-graphrag>=1.21,<2.0",
    "langchain>=1.0",
    "langchain-core>=1.0",
    "langchain-text-splitters>=0.3",
    "langsmith>=0.1",
    "pypdf>=6.0",
    "pymupdf>=1.24",
    "pypdfium2>=4.0",
    "pillow>=10.0",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "scipy>=1.13",
    "rapidocr-onnxruntime>=1.2",
    "groq>=0.9",
    "docling>=2.0",
    "tavily-python>=0.5",
    "sentence-transformers>=3.0",
    "numpy>=1.24",
    "sqlalchemy>=2.0",
    "asyncpg>=0.29",
    "celery>=5.3",
    "redis>=5.0",
    "aiofiles>=23.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
asyncio_mode = "auto"
# The Neo4j driver owns an async connection pool that is bound to the event
# loop that first used it. A session-scoped loop lets every test share the
# one process-wide driver, exactly as the application does.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
