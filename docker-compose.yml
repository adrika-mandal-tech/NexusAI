# ─────────────────────────────────────────────────────────────────
# NexusAI — Production-Ready Docker Compose
# Services: Backend (FastAPI), Celery Worker, Frontend (Next.js),
#           NGINX Reverse Proxy, Qdrant, Neo4j, PostgreSQL, Redis
# ─────────────────────────────────────────────────────────────────

services:
  # ── Backend (FastAPI) ───────────────────────────────────────
  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: nexusai-backend
    command: uvicorn nexusai.main:app --host 0.0.0.0 --port 8000
    restart: unless-stopped
    env_file:
      - ./apps/backend/.env
    environment:
      ENVIRONMENT: production
      QDRANT_URL: http://qdrant:6333
      NEO4J_URL: bolt://neo4j:7687
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/nexusai
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      BACKEND_CORS_ORIGINS: '["http://localhost","http://localhost:80","http://localhost:3000","http://localhost:3001"]'
    volumes:
      - backend_uploads:/home/nexusai/app/.data
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s
    networks:
      - nexusai-network

  # ── Celery Worker ───────────────────────────────────────────
  worker:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: nexusai-worker
    command: celery -A nexusai.workers.celery_app worker --loglevel=info
    restart: unless-stopped
    env_file:
      - ./apps/backend/.env
    environment:
      ENVIRONMENT: production
      QDRANT_URL: http://qdrant:6333
      NEO4J_URL: bolt://neo4j:7687
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/nexusai
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    volumes:
      - backend_uploads:/home/nexusai/app/.data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    networks:
      - nexusai-network

  # ── Frontend (Next.js Standalone) ───────────────────────────
  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ""
    container_name: nexusai-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_BASE_URL: ""
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - nexusai-network

  # ── NGINX Reverse Proxy ───────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: nexusai-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - nexusai-network

  # ── PostgreSQL (Primary Database) ──────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: nexusai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nexusai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nexusai"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nexusai-network

  # ── Redis (Cache & Celery Broker) ──────────────────────────
  redis:
    image: redis:7-alpine
    container_name: nexusai-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nexusai-network

  # ── Qdrant (Vector DB) ─────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:v1.12.0
    container_name: nexusai-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nexusai-network

  # ── Neo4j (Knowledge Graph) ───────────────────────────────
  neo4j:
    image: neo4j:5-community
    container_name: nexusai-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/changeme
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s
    networks:
      - nexusai-network

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  neo4j_data:
  backend_uploads:

networks:
  nexusai-network:
    driver: bridge
